  <!-- Bulb glass -->
  <path d="M16 3 C10.5 3 6 7.5 6 13 C6 16.5 8 19.5 11 21.2 L11 24 C11 24.5 11.4 25 12 25 L20 25 C20.6 25 21 24.5 21 24 L21 21.2 C24 19.5 26 16.5 26 13 C26 7.5 21.5 3 16 3Z" fill="url(#bulbGrad)" opacity="0.9"/>
  
